<script>
const map=L.map("map").setView([50,10],14);

const orangeIcon = new L.Icon({
iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png",
shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34],
shadowSize:[41,41]
});

const greenIcon = L.icon({
iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34],
shadowSize:[41,41]
});

const redIcon = new L.Icon({
iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34],
shadowSize:[41,41]
});

const yellowIcon = new L.Icon({
iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png",
shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34],
shadowSize:[41,41]
});

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"&copy; OpenStreetMap"
}
).addTo(map);

let points=JSON.parse(localStorage.getItem("zustellpunkte")||"[]");
let notes=
JSON.parse(
localStorage.getItem("notes")||"[]"
);
let markers=[];

const clusterLayer = L.markerClusterGroup({
maxClusterRadius:45,
disableClusteringAtZoom:18,
spiderfyOnMaxZoom:true,
showCoverageOnHover:false,
zoomToBoundsOnClick:false
});

clusterLayer.on("clusterclick",function(e){

const bounds=e.layer.getBounds();

map.fitBounds(bounds,{
paddingTopLeft:[0,300],
paddingBottomRight:[0,100],
maxZoom:17
});

});

let line;
let editMode=false;
const ADMIN_PIN="0904";
let editUnlockTimer=null;
const EDIT_UNLOCK_TIME=5*60*1000;
let editingMarkerIndex=null;
let addMode=false;
let deleteMode=false;
let insertMode=false;
let insertAfterIndex=null;
let mailboxMode=false;
let mailboxInsertMode=false;
let mailboxInsertAfterIndex=null;
let deliveryMode=false;
let autoDoneRadius=15;
let myLocation;
let followMe=false;
let nextIndex=0;
let activeStopIndex=null;
let highlightedStreet=null;
let activePart="";
let partRangeMode="";
let partRangeStartIndex=null;

let numberLabels=[];

function clearNumberLabels(){
numberLabels.forEach(l=>map.removeLayer(l));
numberLabels=[];
}

function getHouseNumber(p){
const adresse=p.adresse||"";
const match=adresse.match(/\b\d+[a-zA-Z]?\b/);
return match ? match[0] : "";
}

function renderNumberLabels(){

clearNumberLabels();

if(map.getZoom()<18){
return;
}

points.forEach(p=>{

if(p.briefkasten){
return;
}

const nr=getHouseNumber(p);

if(!nr){
return;
}

const label=L.marker([p.lat,p.lng],{
interactive:false,
icon:L.divIcon({
className:"houseNumberLabel",
html:nr,
iconSize:[24,18],
iconAnchor:[12,28]
})
}).addTo(map);

numberLabels.push(label);

});

}

activePart=part;

if(part==="A"){
alert("A-Teil wird angezeigt.");

function saveNotes(){

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

}

function addNote(){

const ort=
prompt(
"Adresse / Ort:"
);

if(!ort){
return;
}

const text=
prompt(
"Notiz:"
);

if(!text){
return;
}

const now=
new Date();

const datum=
now.toLocaleDateString("de-DE");

const uhrzeit=
now.toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
);

notes.unshift({

datum:datum,
uhrzeit:uhrzeit,
ort:ort,
text:text

});

saveNotes();
renderNotes();

}

function deleteNote(index){

if(
!confirm(
"Notiz löschen?"
)
){
return;
}

notes.splice(index,1);

saveNotes();
renderNotes();

}

function unlockEditSection(){

if(!editUnlocked){

const pin=prompt("PIN für Bearbeitung eingeben:");

if(pin!==ADMIN_PIN){
alert("Falscher PIN");
return;
}

editUnlocked=true;

}

const box=document.getElementById("editSection");

if(box){
box.style.display="block";
}

if(editUnlockTimer){
clearTimeout(editUnlockTimer);
}

editUnlockTimer=setTimeout(function(){
lockEditSection();
},EDIT_UNLOCK_TIME);

}

function lockEditSection(){

editUnlocked=false;

if(editUnlockTimer){
clearTimeout(editUnlockTimer);
editUnlockTimer=null;
}

const box=document.getElementById("editSection");

if(box){
box.style.display="none";
}

}

function renderNotes(){

const box=
document.getElementById(
"notesList"
);

if(!box){
return;
}

box.innerHTML="";

notes.forEach(
(n,index)=>{

const div=
document.createElement("div");

div.style.border=
"1px solid #ddd";

div.style.padding=
"8px";

div.style.marginTop=
"6px";

div.style.borderRadius=
"8px";

div.innerHTML=

"<b>📝 "+
n.datum+
" "+

){

);

else if(

p.teil==="B"
){

[p.lat,p.lng],
{

icon:orangeIcon
}
);

else if(

){

}
);

){

}
);

){

{
draggable:editMode,
icon:redIcon
}
);

}
);

async function importAddressList(){

const text = prompt(
"Liste einfügen\n\nFormat:\nMusterstraße, 1,2,3,4, Schweinfurt\nMaxstraße, 6,8,10,12, Schweinfurt"
);

if(!text){
return;
}

const lines = text
.split("\n")
.map(l => l.trim())
.filter(l => l.length > 0);

for(const line of lines){

const parts = line
.split(",")
.map(p => p.trim())
.filter(p => p.length > 0);

if(parts.length < 3){
continue;
}

const street = parts[0];
const city = parts[parts.length - 1];
const numbers = parts.slice(1, parts.length - 1);

try{

for(let i=0; i<numbers.length; i++){

const fullAddress =
street + " " + numbers[i] + ", " + city;

const res = await fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=" +
encodeURIComponent(fullAddress)
);

const data = await res.json();

if(data.length === 0){
console.log("Adresse nicht gefunden:", fullAddress);
continue;
}

points.push({
lat: parseFloat(data[0].lat),
lng: parseFloat(data[0].lon),
adresse: fullAddress,
firma: "",
hinweis: "",
empfaenger: []
});

draw();

await new Promise(resolve => setTimeout(resolve, 800));

}

}catch(e){

console.log("Fehler bei:", line);

}

}

saveCurrent();
draw();

alert("Import fertig");

}

);

if(dist<=autoDoneRadius){

points[index].done=true;

}
