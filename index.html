<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zustellkarte</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
margin:0;
font-family:Arial;
}

#bar{
padding:8px;
}

#map{
height:82vh;
}

input,button,select{
padding:8px;
margin:3px;
}

.fab-menu{
position:fixed;
right:20px;
bottom:25px;
z-index:9999;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:12px;
}

.fab-main,
.fab-option{
width:58px;
height:58px;
border-radius:50%;
border:none;
background:#ff9800;
color:white;
font-size:28px;
box-shadow:0 4px 10px rgba(0,0,0,0.35);
}

.fab-option{
display:none;
font-size:24px;
}

.fab-menu.open .fab-option{
display:block;
}

button{
cursor:pointer;
}
</style>
</head>

<body>

<div id="bar">

<button onclick="nextStop()">Nächster Zustellpunkt</button>
<button onclick="jumpToMyLocation()">Mein Standort</button>
<button onclick="toggleFollow()">Folgen</button>
<button onclick="distanceToNext()">Entfernung</button>
<button onclick="showStreetList()">Straßen</button>
<button onclick="reportMissingHouse()">Haus fehlt</button>
<button onclick="importAddressList()">Adressliste importieren</button>

<select id="bezirkListe"></select>

<br>

<input
id="searchInput"
placeholder="Straße + Hausnummer + Ort (z.B. Hauptstraße 12, München)">
<button onclick="searchAddress()">Suchen</button>

<details>
<summary>Bearbeitungsmodus</summary>

<br>

<input id="bezirkName" placeholder="Bezirk, z.B. Bezirk 12">
<button onclick="saveDistrict()">Bezirk speichern</button>
<button onclick="downloadDistrictFile()">
Bezirkdatei downloaden
</button>

<button onclick="showQRCode()">
QR-Code anzeigen
</button>
  
<select id="bezirkListe"></select>

<button onclick="loadDistrict()">Bezirk laden</button>

<input type="file" id="importFile" accept=".json" onchange="importDistrict()">

<br>

<input id="empfaenger" placeholder="Empfänger">
<input id="adresse" placeholder="Adresse">
<input id="firma" placeholder="Firma">
<input id="hinweis" placeholder="Hinweis">

</details>

<div id="map"></div>

<div id="fabMenu" class="fab-menu">

<button class="fab-option" onclick="toggleDeleteMode()">🗑️</button>
<button class="fab-option" onclick="toggleEdit()">✏️</button>
<button class="fab-option" onclick="toggleAddMode()">➕</button>
<button class="fab-option" onclick="toggleInsertMode()">↔️</button>
<button class="fab-option" onclick="clearRoute()">❌</button>
<button class="fab-main" onclick="toggleFab()">☰</button>

</div>

<div id="qrBox" style="display:none;">
<div style="
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.6);
z-index:10000;
display:flex;
align-items:center;
justify-content:center;
">

<div style="
background:white;
padding:20px;
border-radius:12px;
text-align:center;
max-width:90%;
">

<h3>App-Link QR-Code</h3>

<img id="qrImage" style="width:240px;height:240px;">

<br><br>

<button onclick="hideQRCode()">Schließen</button>

</div>
</div>
</div>  

<div id="streetBox" style="display:none;">
<div style="
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.6);
z-index:10000;
overflow:auto;
padding:20px;
">

<div style="
background:white;
padding:15px;
border-radius:12px;
max-width:500px;
margin:auto;
">

<h3>Straßen im Bezirk</h3>

<div id="streetList"></div>

<br>

<button onclick="hideStreetList()">Schließen</button>

</div>
</div>
</div>

<script>
const map=L.map("map").setView([50,10],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"&copy; OpenStreetMap"
}
).addTo(map);

let points=JSON.parse(localStorage.getItem("zustellpunkte")||"[]");
let markers=[];
let line;
let editMode=false;
let addMode=false;
let deleteMode=false;
let insertMode=false;
let insertAfterIndex=null;
let myLocation;
let followMe=false;
let nextIndex=0;

function draw(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

if(line){
map.removeLayer(line);
}

points.forEach((p,index)=>{

const marker=L.marker([p.lat,p.lng],{draggable:editMode}).addTo(map);

marker.bindPopup(
"<b>"+(index+1)+". "+(p.adresse||"Haus")+"</b>"+
"<br><b>Empfänger:</b><br>"+
((p.empfaenger||[p.name||""])
.map(e=>"• "+e)
.join("<br>"))+
"<br>Firma: "+(p.firma||"")+
"<br>Hinweis: "+(p.hinweis||"")
);

marker.on("dragend",function(e){
points[index].lat=e.target.getLatLng().lat;
points[index].lng=e.target.getLatLng().lng;
saveCurrent();
draw();
});

marker.on("click",function(){

if(deleteMode){

if(confirm("Diesen Zustellstopp löschen?")){
points.splice(index,1);
saveCurrent();
draw();
}

return;
}

if(insertMode){
insertAfterIndex=index;
alert("Jetzt auf die Karte tippen, wo der neue Zustellstopp eingefügt werden soll.");
return;
}

if(editMode){
editPoint(index);
}

});

markers.push(marker);

});

if(points.length>1){
line=L.polyline(points.map(p=>[p.lat,p.lng])).addTo(map);
}

}

function saveCurrent(){
localStorage.setItem("zustellpunkte",JSON.stringify(points));
}

map.on("click",function(e){

if(!addMode){
return;
}

if(editMode || deleteMode){
return;
}

const punkt={
lat:e.latlng.lat,
lng:e.latlng.lng,
empfaenger:
document
.getElementById("empfaenger")
.value
.split(";")
.map(e=>e.trim())
.filter(e=>e.length>0),
adresse:document.getElementById("adresse").value,
firma:document.getElementById("firma").value,
hinweis:document.getElementById("hinweis").value
};

if(insertMode && insertAfterIndex!==null){

points.splice(insertAfterIndex+1,0,punkt);

insertMode=false;
insertAfterIndex=null;

saveCurrent();
draw();

alert("Zustellstopp wurde eingefügt.");
return;

}else{

points.push(punkt);

}
saveCurrent();

document.getElementById("empfaenger").value="";
document.getElementById("adresse").value="";
document.getElementById("firma").value="";
document.getElementById("hinweis").value="";

draw();

});

function editPoint(index){

const p=points[index];

const neueEmpfaenger=prompt(
"Empfänger bearbeiten, getrennt mit ;",
(p.empfaenger||[p.name||""]).join("; ")
);
if(neueEmpfaenger===null){return;}

const neueAdresse=prompt("Adresse bearbeiten:",p.adresse||"");
if(neueAdresse===null){return;}

const neueFirma=prompt("Firma bearbeiten:",p.firma||"");
if(neueFirma===null){return;}

const neuerHinweis=prompt("Hinweis bearbeiten:",p.hinweis||"");
if(neuerHinweis===null){return;}

points[index].empfaenger=
neueEmpfaenger
.split(";")
.map(
e=>e.trim()
)
.filter(
e=>e.length>0
);

points[index].adresse=
neueAdresse;

points[index].firma=
neueFirma;

points[index].hinweis=
neuerHinweis;

saveCurrent();
draw();

}

function downloadDistrictFile(){

const bezirkName =
document
.getElementById("bezirkName")
.value
.trim()
|| "bezirk";

const data =
JSON.stringify(points,null,2);

const blob =
new Blob(
[data],
{type:"application/json"}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
bezirkName + ".json";

a.click();

URL.revokeObjectURL(a.href);

}
  
function toggleInsertMode(){

insertMode=!insertMode;

if(insertMode){

addMode=true;
editMode=false;
deleteMode=false;
insertAfterIndex=null;

alert("Einfügen AN. Tippe zuerst den Stopp an, NACH dem du einfügen willst.");

}else{

addMode=false;
insertAfterIndex=null;

alert("Einfügen AUS.");

}

draw();

}
  
function toggleAddMode(){

addMode=!addMode;

if(addMode){
editMode=false;
deleteMode=false;
alert("Hinzufügen ist AN. Tippe auf die Karte, um einen Zustellstopp zu setzen.");
}else{
alert("Hinzufügen ist AUS.");
}

draw();

}

function toggleDeleteMode(){

deleteMode=!deleteMode;

if(deleteMode){

editMode=false;
addMode=false;
insertMode=false;
insertAfterIndex=null;

alert("Löschen AN. Tippe einen Zustellstopp an.");

}else{

alert("Löschen AUS.");

}

draw();

}

function toggleEdit(){

editMode=!editMode;

if(editMode){

deleteMode=false;
addMode=false;

alert(
"Bearbeitung AN"
);

}else{

alert(
"Bearbeitung AUS"
);

}

draw();

}

function saveDistrict(){

const name=document.getElementById("bezirkName").value.trim();

if(!name){
alert("Bitte Bezirk-Namen eingeben.");
return;
}

localStorage.setItem(
"bezirk_"+name,
JSON.stringify(points)
);

localStorage.setItem("letzterBezirk",name);

updateDistrictList();

alert("Bezirk gespeichert: "+name);

}

function loadDistrict(){

const select=document.getElementById("bezirkListe");
const name=select.value;

if(!name){
alert("Kein Bezirk ausgewählt.");
return;
}

const data=localStorage.getItem("bezirk_"+name);

if(!data){
alert("Bezirk nicht gefunden.");
return;
}

points=JSON.parse(data);
saveCurrent();

document.getElementById("bezirkName").value=name;
localStorage.setItem("letzterBezirk",name);

nextIndex=0;

draw();

alert("Bezirk geladen: "+name);

}

function deleteDistrict(){

const select=document.getElementById("bezirkListe");
const name=select.value;

if(!name){
alert("Kein Bezirk ausgewählt.");
return;
}

if(!confirm("Bezirk wirklich löschen: "+name+"?")){
return;
}

localStorage.removeItem("bezirk_"+name);

updateDistrictList();

alert("Bezirk gelöscht: "+name);

}

function updateDistrictList(){

const select=document.getElementById("bezirkListe");

select.innerHTML="";

Object.keys(localStorage)
.filter(k=>k.startsWith("bezirk_"))
.map(k=>k.replace("bezirk_",""))
.sort()
.forEach(name=>{

const option=document.createElement("option");
option.value=name;
option.textContent=name;
select.appendChild(option);

});

const letzter=localStorage.getItem("letzterBezirk");

if(letzter){
select.value=letzter;
}

}

function exportRoute(){

const data=JSON.stringify(points,null,2);
const blob=new Blob([data],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=(document.getElementById("bezirkName").value||"bezirk")+".json";
a.click();

}

function clearRoute(){

if(!confirm("Aktuelle Route wirklich löschen?")){
return;
}

points=[];
saveCurrent();
draw();

}

function showLocation(){

if(!navigator.geolocation){
alert("Standort wird von diesem Browser nicht unterstützt.");
return;
}

navigator.geolocation.watchPosition(

function(pos){

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

if(myLocation){
myLocation.setLatLng([lat,lng]);
}else{
myLocation=L.circleMarker([lat,lng],{radius:10}).addTo(map);
}

if(followMe){
map.setView([lat,lng],18);
}

},

function(){
console.log("Standort nicht erlaubt oder nicht verfügbar.");
},

{
enableHighAccuracy:true,
maximumAge:1000
}

);

}

function jumpToMyLocation(){

if(myLocation){
map.setView(myLocation.getLatLng(),18);
}else{
alert("Standort noch nicht gefunden oder nicht erlaubt.");
}

}

function toggleFollow(){

followMe=!followMe;

alert(
followMe
?"Folgen ist AN."
:"Folgen ist AUS."
);

}

function distanceToNext(){

if(!myLocation||points.length===0){
alert("Standort oder Wegpunkte fehlen.");
return;
}

const p=points[nextIndex];

const dist=map.distance(
myLocation.getLatLng(),
[p.lat,p.lng]
);

alert(
"Entfernung zu "+
(nextIndex+1)+
". "+
(p.name||"Wegpunkt")+
": "+
Math.round(dist)+
" Meter"
);

}

function nextStop(){

if(points.length===0){
alert("Keine Wegpunkte vorhanden.");
return;
}

const p=points[nextIndex];

map.setView([p.lat,p.lng],19);

alert(
"Nächstes Haus: "+
(nextIndex+1)+
". "+
(p.name||"Wegpunkt")
);

nextIndex++;

if(nextIndex>=points.length){
nextIndex=0;
}

}

function importDistrict(){

const file =
document
.getElementById(
"importFile"
)
.files[0];

if(!file){

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

try{

points =
JSON.parse(
e.target.result
);

saveCurrent();

draw();

alert(
"Bezirk geladen"
);

}catch{

alert(
"Datei ungültig"
);

}

};

reader.readAsText(
file
);

}
updateDistrictList();

function toggleFab(){
document
.getElementById("fabMenu")
.classList
.toggle("open");
}

let searchMarker;

function searchAddress(){

const query =
document
.getElementById("searchInput")
.value
.trim();

if(!query){
alert("Bitte Adresse eingeben.");
return;
}

fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q="+
encodeURIComponent(query)
)
.then(response=>response.json())
.then(data=>{

if(data.length===0){
alert("Adresse nicht gefunden.");
return;
}

const lat=parseFloat(data[0].lat);
const lon=parseFloat(data[0].lon);

map.setView([lat,lon],19);

if(searchMarker){
searchMarker.setLatLng([lat,lon]);
}else{
searchMarker=L.marker([lat,lon]).addTo(map);
}

searchMarker
.bindPopup("Suchergebnis:<br>"+data[0].display_name)
.openPopup();

})
.catch(()=>{
alert("Fehler bei der Suche.");
});

}

function showQRCode(){

const url =
window.location.href;

const qrUrl =
"https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+
encodeURIComponent(url);

document
.getElementById("qrImage")
.src=qrUrl;

document
.getElementById("qrBox")
.style
.display="block";

}

function hideQRCode(){

document
.getElementById("qrBox")
.style
.display="none";

}
  
function getStreetName(p){

const text =
(p.adresse || "")
.trim();

if(!text){
return "Ohne Straße";
}

return text
.replace(/[0-9].*$/,"")
.trim();

}

function showStreetList(){

const streets = {};

points.forEach((p,index)=>{

const street =
getStreetName(p);

if(!streets[street]){
streets[street]=[];
}

streets[street].push({
point:p,
index:index
});

});

const streetList =
document.getElementById("streetList");

streetList.innerHTML="";

Object.keys(streets)
.sort()
.forEach(street=>{

const items =
streets[street];

const btn =
document.createElement("button");

btn.style.display="block";
btn.style.width="100%";
btn.style.margin="6px 0";
btn.style.padding="10px";
btn.style.textAlign="left";

btn.textContent =
street+
" ("+
items.length+
" Stopps)";

btn.onclick=function(){

const first =
items[0].point;

map.setView(
[
first.lat,
first.lng
],
18
);

document
.getElementById("streetBox")
.style
.display="none";

};

streetList.appendChild(btn);

});

document
.getElementById("streetBox")
.style
.display="block";

}

function hideStreetList(){

document
.getElementById("streetBox")
.style
.display="none";

}

function reportMissingHouse(){

const text = prompt(
"Welches Haus fehlt? Bitte Straße, Hausnummer und Ort eingeben:"
);

if(!text){
return;
}

const bezirk =
document.getElementById("bezirkName").value || "Unbekannter Bezirk";

const subject =
encodeURIComponent("Haus fehlt in Zustellkarte");

const body =
encodeURIComponent(
"Bezirk: "+bezirk+"\n\n"+
"Fehlendes Haus:\n"+text+"\n\n"+
"Gemeldet über Zustellkarte"
);

window.location.href =
"mailto:albert.nico.2609@gmail.com?subject="+subject+"&body="+body;

}

async function importAddressList(){

const text = prompt(
"Adressen einfügen\n\nFormat:\nMusterstraße, 1,2,3,4, Schweinfurt"
);

if(!text){
return;
}

const lines = text
.split("\n")
.map(l => l.trim())
.filter(l => l.length > 0);

for(let i=0; i<lines.length; i++){

const parts = lines[i]
.split(",")
.map(p => p.trim())
.filter(p => p.length > 0);

if(parts.length < 3){
continue;
}

const street = parts[0];
const city = parts[parts.length - 1];
const numbers = parts.slice(1, parts.length - 1);

for(const nr of numbers){

const addr = street + " " + nr + ", " + city;

try{

const res = await fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=" +
encodeURIComponent(addr)
);

const data = await res.json();

if(data.length > 0){

points.push({
lat: parseFloat(data[0].lat),
lng: parseFloat(data[0].lon),
adresse: addr,
firma: "",
hinweis: "",
empfaenger: []
});

draw();

}

await new Promise(resolve => setTimeout(resolve, 1200));

}catch(e){

console.log("Nicht gefunden oder Fehler:", addr);

}

}

}

saveCurrent();
draw();

alert("Import fertig");

}

showLocation();
draw();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
